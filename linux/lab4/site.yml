---
- name: Deploy Lab4 Service
  hosts: lab4
  become: yes
  vars:
    service_dir: /opt/lab4-service
    web_root: "{{ service_dir }}/html"
    student_name: "СЕМЕНОВА"

  tasks:
    - name: Install required packages
      apt:
        name:
          - python3
          - curl
        state: present
        update_cache: yes

    - name: Create service directory
      file:
        path: "{{ service_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Create web root directory
      file:
        path: "{{ web_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Deploy index.html
      copy:
        content: "<h1>{{ student_name }}</h1>\n"
        dest: "{{ web_root }}/index.html"
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Deploy service script
      copy:
        src: service.sh
        dest: "{{ service_dir }}/service.sh"
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Deploy systemd unit file
      copy:
        src: lab4-service.service
        dest: /etc/systemd/system/lab4-service.service
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start lab4-service
      systemd:
        name: lab4-service
        enabled: yes
        state: started

    - name: Wait for service to start
      wait_for:
        port: 8000
        delay: 5
        timeout: 30

    - name: Healthcheck via URI
      uri:
        url: http://127.0.0.1:8000/
        status_code: 200
      register: health_result

    - name: Print healthcheck result
      debug:
        msg: "Healthcheck status: {{ health_result.status }}"
